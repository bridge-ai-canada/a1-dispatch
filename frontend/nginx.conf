# nginx config for A1 Field Pro SPA
# - Compress text assets
# - 1-year cache for hashed bundles
# - SPA fallback to index.html
# - Strict CSP + security headers
# - Optional /api reverse-proxy when BACKEND_URL is set at runtime (see entrypoint)

server {
    listen       8080 default_server;
    listen       [::]:8080 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/xml+rss application/wasm image/svg+xml;

    # Security headers (browser app)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Note: CSP intentionally permissive for inline styles (Tailwind/Phosphor)
    # tighten further per environment.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com; font-src 'self' data:; object-src 'none'; base-uri 'self'" always;

    # Healthcheck (used by docker HEALTHCHECK / ALB)
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Hashed asset cache (CRA outputs hashed filenames in /static/)
    location /static/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker — never cached
    location = /service-worker.js {
        expires 0;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 404 for direct PHP-style probes
    location ~* \.(php|asp|aspx|jsp)$ {
        return 404;
    }
}
