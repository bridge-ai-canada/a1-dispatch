name: Nightly Mongo Backup

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install mongodump
        run: |
          wget -qO- https://www.mongodb.org/static/pgp/server-7.0.asc | sudo gpg --dearmor -o /etc/apt/keyrings/mongodb-7.0.gpg
          echo "deb [signed-by=/etc/apt/keyrings/mongodb-7.0.gpg] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-7.list
          sudo apt-get update -qq
          sudo apt-get install -y mongodb-database-tools
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKUP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Run backup script
        env:
          MONGO_URL: ${{ secrets.MONGO_URL_PROD }}
          S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          GPG_RECIPIENT: ${{ vars.GPG_RECIPIENT }}
        run: bash scripts/backup_mongo.sh
