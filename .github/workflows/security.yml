name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  python-deps:
    name: Python deps · pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --strict || true

  yarn-audit:
    name: JS deps · yarn audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: yarn, cache-dependency-path: frontend/yarn.lock }
      - working-directory: frontend
        run: yarn install --frozen-lockfile
      - working-directory: frontend
        run: yarn npm audit --severity=high || true

  codeql:
    name: CodeQL · static analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: ${{ matrix.language }} }
      - uses: github/codeql-action/analyze@v3

  secret-scan:
    name: gitleaks · secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-images:
    name: Trivy · container scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (local)
        run: docker build -t a1fp/backend:scan ./backend
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: a1fp/backend:scan
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
