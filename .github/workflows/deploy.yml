name: Deploy to AWS ECS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging

permissions:
  id-token: write   # OIDC → AWS
  contents: read

env:
  AWS_REGION:    ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_BACKEND:   ${{ vars.ECR_BACKEND  }}    # e.g. 1234.dkr.ecr.us-east-1.amazonaws.com/a1fp-backend
  ECR_FRONTEND:  ${{ vars.ECR_FRONTEND }}
  ECS_CLUSTER:   ${{ vars.ECS_CLUSTER  }}
  BACKEND_SVC:   ${{ vars.BACKEND_SERVICE }}
  FRONTEND_SVC:  ${{ vars.FRONTEND_SERVICE }}

jobs:
  deploy:
    name: Build → ECR → ECS (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Set tag
        id: tag
        run: |
          SHA=${GITHUB_SHA::8}
          echo "tag=$SHA" >> $GITHUB_OUTPUT
          echo "ts=$(date -u +%Y%m%dT%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_BACKEND }}:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_BACKEND }}:latest
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_FRONTEND }}:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_FRONTEND }}:latest
          build-args: |
            REACT_APP_BACKEND_URL=${{ vars.REACT_APP_BACKEND_URL }}

      - name: Force ECS service redeploy
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$BACKEND_SVC"  --force-new-deployment >/dev/null
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$FRONTEND_SVC" --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$BACKEND_SVC" "$FRONTEND_SVC"

      - name: Smoke check
        run: |
          curl -fsS "${{ vars.SMOKE_HEALTH_URL }}" | tee /tmp/health.json
          test "$(jq -r .status /tmp/health.json)" = "ok"
