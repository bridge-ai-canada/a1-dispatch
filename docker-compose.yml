# Local dev / staging docker-compose for A1 Field Pro
# Usage:
#   cp .env.example .env && docker compose up -d
# Service URLs:
#   frontend  http://localhost:3000
#   backend   http://localhost:8001/api/health
#   mongo     mongodb://localhost:27017

version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: a1fp-mongo
    restart: unless-stopped
    command: ["--bind_ip_all", "--quiet"]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: a1fp-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: a1_field_pro
      CORS_ORIGINS: "http://localhost:3000"
      APP_VERSION: ${APP_VERSION:-dev}
      GIT_SHA: ${GIT_SHA:-local}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8001:8001"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8001}
    container_name: a1fp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  mongo-data:
  mongo-config:
